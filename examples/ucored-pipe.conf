{
	"filters": {
		"name": "corepipe",
		"match": {
			comm: ".*",
		},
		"execute": {
			/*
			 * For cores obtained from ucoredev(8), this is
			 * especially of interest as we can pipe the cores
			 * somewhere else entirely without it hitting the disk.
			 * Each pipe in that case will entail a full copy of the
			 * data out to a new memfd so that the piped-to program
			 * will get just the data and not our leading frame.
			 */
			"type": "pipe",
			"command": "/opt/bin/corepipe %n",
		},
	},
}

