{
	"filters": {
		"name": "corepipe",
		"match": {
			comm: ".*",
		},
		"execute": {
			/*
			 * For cores obtained from ucoredev(8), this is
			 * especially of interest as we can pipe the cores
			 * somewhere else entirely without it hitting the disk.
			 *
			 * Note that the file position of stdin when `corepipe`
			 * starts may be significant.  Maybe this is a design
			 * flaw, but currently the shmfd is passed with the
			 * frame included and the fd is exposed to ucored(8)
			 * read-only.  We thus can't really trim the frame, so
			 * we record the offset of the core data and seek to
			 * it prior to piping it out.
			 *
			 * If this is a problem and the piped program cannot be
			 * altered to record the position in case it needs to
			 * seek back, one can always execute a
			 * move + pipe + discard chain.  Perhaps a "mktemp"
			 * action to create a discardable temp file would be
			 * good.
			 */
			"type": "pipe",
			"command": "/opt/bin/corepipe %n",
		},
	},
}

