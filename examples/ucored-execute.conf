{
	"filters": [
		{
			"name": "ucrash",
			"match": {
				/*
				 * We use this to effectively catch everything,
				 * as all cores *should* have a comm specified.
				 */
				comm: ".*",
			},
			"execute": [
				{
					/*
					 * For execute, one would want to do a
					 * move first if ucoredev(4) is present
					 * to persist the file to disk, then
					 * we have a filename that we can
					 * execute against.
					 */
					"type": "move",
					"destination": "/var/ucrash",
				},
				{
					"type": "execute",

					/*
					 * %f is replaced with the filename that
					 * we moved the corefile to in
					 * /var/ucrash above.
					 */
					"command": ["/root/core-script.sh", "%f"],
					"env": {
						/*
						 * Note that ucl needs a
						 * double-backslash to escape
						 * the variable in Lua.
						 */
						"ESCAPED_PATH": "\\$PATH",

						/*
						 * Shell-style variable names
						 * are resolved from the
						 * ucored(8) environment every
						 * time, because we can't rely
						 * on these being processed in
						 * any given order.
						 */
						"PATH": "/usr/local/bin:$PATH",

						/*
						 * The usual % substitutions
						 * also work here, but only in
						 * values.
						 */
						"UCORE_DOMAINNAME": "%d",
					},
				},
			],
		},
	],
}

