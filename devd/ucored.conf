# Handle userland coredumps; this particular rule passes information about the
# coredump on to ucored(8) for handling.  ucored(8) will do some filtering
# depending on its configuration, and apply some conditional action.
#
# Note that this rule effectively does nothing if ucoredev(4) is in use, as our
# customer ucore dumper does not generate any devd notifications at all.  It
# assumes that ucored(8) will instead run and take care of anything in-flight,
# and that the userland side will be using kqueue/poll/select to determine if
# there's a coredump waiting.
notify 10 {
	match "system"          "kernel";
	match "subsystem"       "signal";
	match "type"            "coredump";
	action "/usr/local/libexec/ucore-shuttle -j $jid -P $ppid -p $pid -s $signo $comm $core";
};
